name: Test & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install core package dependencies
        run: npm ci
        working-directory: packages/core

      - name: Build @flare/core
        run: npm run build
        working-directory: packages/core

      - name: Run unit tests
        run: npm run test:unit

  build-ui:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flare-visual-ui/package-lock.json

      - name: Install core package dependencies
        run: npm ci
        working-directory: packages/core

      - name: Build @flare/core
        run: npm run build
        working-directory: packages/core

      - name: Install UI dependencies
        run: npm ci
        working-directory: flare-visual-ui

      - name: Run UI tests
        run: npx vitest run
        working-directory: flare-visual-ui

      - name: Build UI
        run: npm run build
        working-directory: flare-visual-ui
        env:
          VITE_BASE_PATH: /FLARE/app/

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r flare-visual-ui/dist/* _site/app/
          cp landing/index.html _site/
          cp -r llm-comparison-tool _site/llm-comparison-tool
          cp -r Slopcaster _site/slopcaster
          cp -r simple-routing _site/simple-routing
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-ui
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
